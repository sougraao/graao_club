<!doctype html>
<html lang="pt-BR" data-default-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar · IA para TDAH</title>
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="assets/img/graao-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/graao-ds.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{var t=JSON.parse(localStorage.getItem("graao:theme"));document.documentElement.dataset.theme=t==="light"||t==="dark"?t:"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <script src="assets/js/graao-icons.js" defer></script>
  <script src="assets/js/graao-ds.js" defer></script>
  <script src="assets/js/env.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" defer></script>
  <script src="assets/js/api.js?v=20261112-academy-1" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <main class="auth-wrap">
    <aside class="auth-art">
      <div class="objs" aria-hidden="true"><img class="o1" src="assets/img/obj-grao.svg" alt=""><img class="o2" src="assets/img/obj-orbe.svg" alt=""><img class="o3" src="assets/img/obj-broto.svg" alt=""></div>
      <a href="index.html" class="brand" aria-label="graao club — início"><img src="assets/img/graao-mark.svg" alt=""><b>graao</b><span style="color:#ffffff99">club</span></a>
      <div>
        <span class="g-eyebrow" style="color:#ffffffb3">IA para TDAH</span>
        <h2 class="g-h1" id="art-title" style="margin-top:18px;max-width:14ch">Que bom te ver de novo.</h2>
        <p class="g-lead" id="art-sub" style="margin-top:12px;color:#ffffffb3;max-width:40ch">Seus projetos continuam de onde você parou.</p>
      </div>
    </aside>

    <section class="auth-form">
      <form id="auth-form" novalidate>
        <span class="g-eyebrow">graao club</span>
        <h1 class="g-h3" id="auth-title">Entrar na sua conta</h1>
        <p class="g-body" id="auth-sub" style="margin-bottom:10px">Bem-vindo de volta.</p>

        <div class="social" id="social" hidden>
          <button class="g-btn g-btn--lg g-btn--block" type="button" id="google-btn" style="grid-column:1/-1"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.43.34-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>Continuar com Google</button>
        </div>

        <div class="divider" id="social-divider" hidden>ou com e-mail</div>

        <div class="g-field" id="name-field" hidden><input id="name" type="text" autocomplete="name" placeholder=" "><label for="name">Nome</label></div>
        <div class="g-field"><input id="email" type="email" autocomplete="email" required placeholder=" "><label for="email">E-mail</label></div>
        <div class="g-field"><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder=" "><label for="password">Senha</label>
          <span class="g-field__action"><button class="g-icon-btn g-icon-btn--sm g-icon-btn--ghost" type="button" id="toggle-pw" aria-label="Mostrar senha"><svg class="g-icon g-icon--sm" aria-hidden="true"><use href="#i-eye"/></svg></button></span>
        </div>
        <a class="g-caption" id="forgot" href="#" style="justify-self:end">Esqueci minha senha</a>
        <p class="form-error" role="alert"></p>
        <button class="g-btn g-btn--accent g-btn--lg g-btn--block g-btn--arrow" id="submit" type="submit"><span id="submit-label">Entrar</span><svg class="g-icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
        <p class="g-caption" id="switch" style="text-align:center;margin-top:6px">Ainda não tem conta? <a class="g-accent-text" href="entrar.html?modo=cadastro">Criar conta</a> · <a class="g-accent-text" href="index.html#primeira-turma">Conhecer a primeira turma</a></p>
      </form>
    </section>
  </main>
</body>
</html>
